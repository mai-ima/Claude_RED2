<!--META {"title": "アカウント作成", "desc": "SUZAKUアカウントの新規作成(無料)。注文の照会やサポートがより便利になります。", "theme": "dark", "crumbs": [["アカウント", "/account/login/"], ["新規作成", null]], "group": "アカウント", "noindex": true} -->

<section class="hero hero--page">
  <div class="hero__inner hero-enter">
    <p class="eyebrow">CREATE ACCOUNT</p>
    <h1 class="t-h1">アカウント作成</h1>
    <p class="t-soft">無料です。注文の照会・修理状況の確認・限定情報の受け取りが、ひとつのIDで。</p>
  </div>
</section>

<section class="section--sm section--flush-top" style="padding-top:var(--sp-5)">
  <div class="container">
    <div id="registerDone" hidden>
      <div class="auth-card t-center" style="justify-items:center">
        <div class="card__icon anim-pulse" style="width:64px;height:64px;border-radius:50%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:28px;height:28px"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
        <h2 class="t-h2">ようこそ、SUZAKUへ。</h2>
        <p class="t-soft t-small">アカウントを作成し、ログインしました。</p>
        <p class="t-small t-soft">確認メールをお送りしました(デモのため実際には送信されません)。</p>
        <div class="cluster cluster--center">
          <a class="btn btn--primary" href="/account/">マイページへ</a>
          <a class="btn btn--ghost" href="/store/">ストアを見る</a>
        </div>
      </div>
    </div>
    <form class="auth-card" id="registerForm" novalidate>
      <div class="notice" id="regError" hidden></div>
      <div class="field"><label for="regName">お名前 <span class="req">必須</span></label>
        <input class="input" id="regName" required autocomplete="name" placeholder="朱雀 太郎"></div>
      <div class="field"><label for="regEmail">メールアドレス <span class="req">必須</span></label>
        <input class="input" id="regEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="regPw">パスワード <span class="req">必須</span></label>
        <input class="input" id="regPw" type="password" required autocomplete="new-password" placeholder="8文字以上">
        <p class="field__hint">8文字以上。この端末のブラウザ内にのみ保存されます(デモ)。</p></div>
      <div class="field"><label for="regPw2">パスワード(確認) <span class="req">必須</span></label>
        <input class="input" id="regPw2" type="password" required autocomplete="new-password"></div>
      <label class="choice" style="align-items:center">
        <input type="checkbox" id="regAgree">
        <span class="choice__radio" style="border-radius:6px"></span>
        <span class="choice__body"><span class="choice__title"><a href="/legal/terms/" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">利用規約</a>と<a href="/legal/privacy/" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">プライバシーポリシー</a>に同意します</span></span>
      </label>
      <button class="btn btn--primary btn--lg btn--block" type="submit">アカウントを作成</button>
      <p class="t-small t-soft t-center">すでにお持ちの方は <a href="/account/login/" style="color:var(--accent);font-weight:700">ログイン</a></p>
    </form>
  </div>
</section>
